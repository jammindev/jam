name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code: the token gets no write access.
permissions:
  contents: read

jobs:
  test:
    # Pinned: Python 3.9 builds are not published for newer Ubuntu images.
    runs-on: ubuntu-24.04
    # A test stuck on a child process must not hold the runner for hours.
    timeout-minutes: 10
    strategy:
      matrix:
        # The oldest supported Python and a recent one.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Pinned so that a new release cannot turn the build red on its own.
      - run: pip install pytest==8.4.2 ruff==0.17.4
      - run: ruff check .
      - run: pytest -q tests
