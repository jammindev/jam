name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code: the token gets no write access (public repo).
permissions:
  contents: read

jobs:
  check:
    # The kit is Python standard library only: the runner's python3 and git are enough.
    runs-on: ubuntu-latest
    # A test stuck on a child process must not hold the runner for the default 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Discovery runs from the root into the hooks/ and scripts/ packages; on
      # Python 3.12+, finding zero tests fails the job, so it cannot pass empty.
      - run: python3 -m unittest
