name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code: the token gets no write access (public repo).
permissions:
  contents: read

jobs:
  check:
    # The core is portable and the app is only built, not launched: Linux is enough.
    runs-on: ubuntu-latest
    # A test stuck on a child process must not hold the runner for the default 6 hours.
    timeout-minutes: 10
    env:
      # The Electron binary is only needed to run the app, not to typecheck, test or build it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json (packageManager).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
